<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="page-column-header">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="page-column">
    <app-catalog-section></app-catalog-section>

    <app-images-section></app-images-section>

    <ion-list>
      <ion-list-header>
        <ion-label>Sync</ion-label>
      </ion-list-header>
      <ion-item>
        <ion-label>Status</ion-label>
        <ion-note slot="end" data-testid="sync-status">{{ syncStatusLabel() }}</ion-note>
      </ion-item>
      @if (rejectedOperations() > 0) {
        <ion-item lines="none">
          <ion-note color="warning" data-testid="rejected-operations">
            {{ rejectedOperations() }} change(s) were rejected by the server and reverted.
          </ion-note>
        </ion-item>
      }
    </ion-list>

    <app-collection-value-section></app-collection-value-section>

    <app-account-section></app-account-section>
  </div>
</ion-content>
