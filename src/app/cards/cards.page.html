<ion-split-pane contentId="cards-main" when="lg">
  <ion-menu
    contentId="cards-main"
    menuId="cards-sets"
    [swipeGesture]="false"
    [disabled]="!layout.wide()"
  >
    <ion-header>
      <ion-toolbar>
        <ion-title>Cards</ion-title>
      </ion-toolbar>
      <ion-toolbar>
        <app-catalog-segment />
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <app-sets-list [selectedKey]="selectedKey()" (selected)="open($event)" />
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="cards-main">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-split-pane>
