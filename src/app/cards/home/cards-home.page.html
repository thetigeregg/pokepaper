@if (layout.wide()) {
  @if (search.active()) {
    <ion-header>
      <ion-toolbar>
        <ion-title>Search</ion-title>
      </ion-toolbar>
      <ion-toolbar>
        <app-search-filters />
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <app-search-results />
    </ion-content>
  } @else {
    <ion-content>
      <div class="pick-set ion-text-center ion-padding">
        <ion-icon name="albums-outline" color="medium"></ion-icon>
        <ion-text color="medium"><p>Select a set to see its cards, or search</p></ion-text>
      </div>
    </ion-content>
  }
} @else {
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>Cards</ion-title>
      <ion-buttons slot="end">
        <app-language-button
          [languages]="browse.languages()"
          [value]="browse.language()"
          (changed)="browse.pickLanguage($event)"
        />
        <app-filters-button />
      </ion-buttons>
    </ion-toolbar>
    <ion-toolbar>
      <app-card-searchbar />
    </ion-toolbar>
    <ion-toolbar>
      <app-catalog-segment />
    </ion-toolbar>
  </ion-header>
  <ion-content [fullscreen]="true">
    @if (search.active()) {
      <app-search-results />
    } @else {
      <app-sets-list (selected)="open($event)" />
    }
  </ion-content>
}
