@if (layout.wide()) {
  <ion-content>
    <div class="pick-set ion-text-center ion-padding">
      <ion-icon name="albums-outline" color="medium"></ion-icon>
      <ion-text color="medium"><p>Select a set to see its cards</p></ion-text>
    </div>
  </ion-content>
} @else {
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>Cards</ion-title>
    </ion-toolbar>
    <ion-toolbar>
      <app-catalog-segment />
    </ion-toolbar>
  </ion-header>
  <ion-content [fullscreen]="true">
    <app-sets-list (selected)="open($event)" />
  </ion-content>
}
