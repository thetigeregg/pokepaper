# Optional: put edge on Nginx Proxy Manager's Docker network.
#
# Why: when NPM reaches edge through the published EDGE_PORT, Docker's
# port proxy rewrites every connection's source to the bridge gateway, so
# edge can't tell NPM apart from any other device on the LAN, and
# TRUSTED_PROXIES can't be narrowed usefully. On a shared network NPM
# connects from its own address, so:
#
#   - NPM forwards to http://pokepaper-edge:8080 (container name), not
#     <nas-ip>:EDGE_PORT
#   - set EDGE_BIND=127.0.0.1 so EDGE_PORT stops listening on the LAN:
#     Docker may route published-port traffic through this network's
#     gateway, which a subnet in TRUSTED_PROXIES would trust
#   - TRUSTED_PROXIES = NPM's address (with a fixed IP) or the network's
#     subnet. A subnet trusts every container on that network, plus
#     anything reaching edge through the network's gateway (the host, and
#     the published port unless EDGE_BIND=127.0.0.1)
#
# Requires a user-defined network (Docker's default "bridge" has no
# container-name DNS). Use it as an extra compose file (Portainer Git stack:
# "Additional paths"), and include it in every manual compose command:
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d
# with NPM_NETWORK and TRUSTED_PROXIES set. See docs/nas-deployment.md, section 4.

services:
  edge:
    networks:
      - default
      - npm

networks:
  npm:
    name: ${NPM_NETWORK:?Set NPM_NETWORK to the name of Nginx Proxy Manager's Docker network}
    external: true
