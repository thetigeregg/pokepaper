# PokePaper on the NAS (Portainer stack). See docs/nas-deployment.md.
#
# Public path: Cloudflare -> cloudflared tunnel -> Nginx Proxy Manager ->
# edge (:EDGE_PORT) -> server (internal only). Only `edge` is published on
# the host; `server` is reachable solely on this stack's network.

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/thetigeregg/pokepaper-server:main}
    container_name: pokepaper-server
    restart: unless-stopped
    # Unprivileged by default (the image's `node` user, uid 1000). On a
    # Synology shared folder, whose ACLs override chown, set PUID/PGID to a
    # DSM user that the folder's ACL already allows (`id <dsm-user>`). See
    # docs/nas-deployment.md, section 1.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Not published on the host. To reach it directly on the LAN for
    # debugging, uncomment (and keep it off the public proxy):
    # ports:
    #   - "${SERVER_PORT:-3000}:3000"
    volumes:
      # Both must be writable by PUID:PGID (default 1000:1000).
      - ${NAS_DATA_ROOT:-./nas-data}/server-data:/app/server/data
      - ${NAS_DATA_ROOT:-./nas-data}/server-backups:/app/server/backups
      # One file per secret (e.g. setup_token), mounted read-only.
      - type: bind
        source: ${SECRETS_HOST_DIR:-./nas-secrets}
        target: /run/secrets
        read_only: true
    environment:
      TZ: ${TZ:-Europe/Zurich}
      NODE_ENV: production
      # The public HTTPS origin, e.g. https://pokepaper.example.com. Passkeys
      # are bound to its hostname: changing it later invalidates them.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public https origin}
      # First-passkey setup token. Delete the file after setting up.
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      # Cloudflare sets (and overwrites) this header with the real client IP;
      # rate limits key on it. edge is the one proxy hop in front of server.
      CLIENT_IP_HEADER: cf-connecting-ip
      TRUST_PROXY_HOPS: "1"
      # Optional overrides (defaults shown):
      # SESSION_TTL_DAYS: "90"
      # BACKUP_KEEP: "14"
      # BACKUP_INTERVAL_HOURS: "24"
      # RATE_LIMIT_PER_MINUTE: "600"
      # AUTH_RATE_LIMIT_PER_MINUTE: "20"
      # LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  edge:
    image: ${EDGE_IMAGE:-ghcr.io/thetigeregg/pokepaper-edge:main}
    container_name: pokepaper-edge
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Point the Nginx Proxy Manager proxy host at <nas-ip>:EDGE_PORT.
      - "${EDGE_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Zurich}
      # Proxies allowed to set CF-Connecting-IP (the client IP the server
      # rate-limits on). The default trusts any private address; narrow it to
      # Nginx Proxy Manager's address as seen by edge (docs/nas-deployment.md).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
