name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish both images even if their inputs didn't change
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue rather than overlap. A queued run that GitHub replaces with a
# newer one is fine: every run releases the latest main, which includes
# everything merged before it.
concurrency:
  group: pokepaper-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version and Tag
    # Only main is ever released (a manual run from another branch must not
    # push that branch to main), and the [skip ci] release commit itself is
    # never re-released.
    if: ${{ github.ref == 'refs/heads/main' && !(startsWith(github.event.head_commit.message, 'chore(release):') && contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.push.outputs.release_sha }}
      # true only when this run pushed a new release commit and tag.
      released: ${{ steps.push.outputs.released }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the release commit can be
      # pushed to the protected main branch: the app is a ruleset bypass actor.
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOCOMMIT_APP_PRIVATE_KEY }}

      # The latest main, not the triggering commit: if more merges landed
      # since this run was queued, they're released together.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version and changelog (Conventional Commits)
        id: version
        run: npm exec -- devx release version

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push release
        id: push
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to release (no releasable commits since the last tag)."
            { echo "released=false"; echo "release_sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists but package.json is behind it. Sync package.json with the latest tag before releasing."
            exit 1
          fi
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          git tag "${RELEASE_TAG}"
          # Branch and tag land together or not at all. If main moved since
          # checkout, this run is superseded: the queued next run releases
          # the newer main (including these commits).
          if ! git push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"; then
            echo "::warning::main moved during the release; superseded by the next run."
            { echo "released=false"; echo "release_sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "released=true"; echo "release_sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

  detect_changes:
    name: Detect image changes
    needs: release
    if: needs.release.outputs.released == 'true' || inputs.force_publish
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.server.outputs.should_publish }}
      edge: ${{ steps.edge.outputs.should_publish }}
      ota: ${{ steps.ota.outputs.ota }}
      ota_paths: ${{ steps.ota.outputs.ota_paths }}
      ota_skipped_reason: ${{ steps.ota.outputs.ota_skipped_reason }}
      ota_native_build_number: ${{ steps.ota.outputs.ota_native_build_number }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORCE_PUBLISH: ${{ inputs.force_publish == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Evaluate server image inputs
        id: server
        run: |
          args=(--image server --head "$TAG" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--force); fi
          node scripts/image-should-publish.mjs "${args[@]}"

      - name: Evaluate edge image inputs
        id: edge
        run: |
          args=(--image edge --head "$TAG" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--force); fi
          node scripts/image-should-publish.mjs "${args[@]}"

      # iOS OTA bundle (docs/ios.md -> OTA updates): built into the edge
      # image when web code changed since the last bundle (or TestFlight
      # build) and nothing native changed since the TestFlight build recorded
      # by ios-testflight.yml. It must never block the images: if the gate
      # itself fails, OTA is skipped.
      - name: Evaluate iOS OTA bundle
        id: ota
        env:
          NATIVE_BUILD: ${{ vars.IOS_OTA_NATIVE_BUILD }}
          BUNDLE_SHA: ${{ vars.IOS_OTA_BUNDLE_SHA }}
        run: |
          if ! node scripts/ios-release-gate.mjs --head "$TAG" --native-build "$NATIVE_BUILD" --bundle-sha "$BUNDLE_SHA" --github-output "$GITHUB_OUTPUT"; then
            echo "::warning::The iOS release gate failed; no OTA bundle for this release."
            { echo "ota=false"; echo "ota_paths="; echo "ota_skipped_reason=The iOS release gate failed (see the Detect image changes log)."; echo "ota_native_build_number="; } >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.image }} image
    needs: [release, detect_changes]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, edge]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pokepaper-${{ matrix.image }}
      # A new OTA bundle always means rebuilding edge (it carries the bundle).
      CHANGED: ${{ matrix.image == 'server' && needs.detect_changes.outputs.server || (needs.detect_changes.outputs.edge == 'true' || needs.detect_changes.outputs.ota == 'true') }}
      BUILD_OTA: ${{ matrix.image == 'edge' && needs.detect_changes.outputs.ota == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            type=raw,value=${{ needs.release.outputs.major }}
            type=sha,format=short

      # Public repo, public logs: GitHub masks the origin secret's exact
      # value, but not its bare hostname (which OTA build output could show).
      - name: Mask the backend host
        if: env.BUILD_OTA == 'true'
        env:
          IOS_BACKEND_ORIGIN_PROD: ${{ secrets.IOS_BACKEND_ORIGIN_PROD }}
        run: |
          host=$(node -e 'try { console.log(new URL(process.env.IOS_BACKEND_ORIGIN_PROD).hostname) } catch {}')
          if [ -n "$host" ]; then
            echo "::add-mask::$host"
          fi

      # Fails before the image build if the signing secret is missing or
      # isn't an RSA private key. The key goes to a temp file for BuildKit.
      - name: Prepare the OTA signing key
        if: env.BUILD_OTA == 'true'
        env:
          IOS_LIVE_UPDATE_PRIVATE_KEY: ${{ secrets.IOS_LIVE_UPDATE_PRIVATE_KEY }}
          IOS_OTA_NATIVE_BUILD_NUMBER: ${{ needs.detect_changes.outputs.ota_native_build_number }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_OTA_NATIVE_BUILD_NUMBER" ]; then
            echo "::error::The gate chose an OTA bundle but reported no native build number" >&2
            exit 1
          fi
          (umask 077; printf '%s\n' "$IOS_LIVE_UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/ios-live-update-key.pem")
          node -e '
            const { createPrivateKey } = require("node:crypto");
            const key = createPrivateKey(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (key.asymmetricKeyType !== "rsa") throw new Error("IOS_LIVE_UPDATE_PRIVATE_KEY is not an RSA private key");
          ' "$RUNNER_TEMP/ios-live-update-key.pem"

      - name: Build and push (with a new iOS OTA bundle)
        if: env.CHANGED == 'true' && env.BUILD_OTA == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_IOS_OTA=true
            IOS_OTA_NATIVE_BUILD_NUMBER=${{ needs.detect_changes.outputs.ota_native_build_number }}
          secrets: |
            IOS_BACKEND_ORIGIN_PROD=${{ secrets.IOS_BACKEND_ORIGIN_PROD }}
          secret-files: |
            IOS_LIVE_UPDATE_PRIVATE_KEY=${{ runner.temp }}/ios-live-update-key.pem
          cache-from: type=gha,scope=pokepaper-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=pokepaper-${{ matrix.image }}

      # Without a new bundle, edge carries the current image's bundles
      # forward (OTA_PREVIOUS_IMAGE), so they stay published.
      - name: Build and push (inputs changed)
        if: env.CHANGED == 'true' && env.BUILD_OTA != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.image == 'edge' && format('OTA_PREVIOUS_IMAGE={0}:main', env.IMAGE) || '' }}
          cache-from: type=gha,scope=pokepaper-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=pokepaper-${{ matrix.image }}

      - name: Remove the OTA signing key
        if: always() && env.BUILD_OTA == 'true'
        run: rm -f "$RUNNER_TEMP/ios-live-update-key.pem"

      # The next release only builds a bundle if web code changed since this
      # one (scripts/ios-release-gate.mjs). Repo variables need the release
      # GitHub App (Variables: write).
      - name: Create GitHub App token
        if: env.BUILD_OTA == 'true'
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOCOMMIT_APP_PRIVATE_KEY }}

      - name: Record the bundled release
        if: env.BUILD_OTA == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: gh variable set IOS_OTA_BUNDLE_SHA --body "$RELEASE_SHA"

      - name: Write OTA summary
        if: matrix.image == 'edge'
        env:
          OTA: ${{ needs.detect_changes.outputs.ota }}
          OTA_PATHS: ${{ needs.detect_changes.outputs.ota_paths }}
          OTA_SKIPPED_REASON: ${{ needs.detect_changes.outputs.ota_skipped_reason }}
          NATIVE_BUILD: ${{ needs.detect_changes.outputs.ota_native_build_number }}
        run: |
          {
            if [ "$OTA" = "true" ]; then
              echo "## iOS OTA bundle published"
              echo
              echo "Built for TestFlight build ${NATIVE_BUILD}, from: ${OTA_PATHS}"
            else
              echo "## No new iOS OTA bundle"
              echo
              echo "${OTA_SKIPPED_REASON:-Not evaluated.} Existing bundles carried forward."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Unchanged image: no rebuild, but every release still gets every
      # version tag on both images (so pinning SERVER_IMAGE/EDGE_IMAGE to a
      # version always works). The current :main image is re-tagged.
      - name: Re-tag current image (inputs unchanged)
        if: env.CHANGED != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}:main"
          {
            echo "## ${{ matrix.image }} image unchanged"
            echo
            echo "No ${{ matrix.image }} image inputs changed since the previous release: \`${IMAGE}:main\` was re-tagged for ${{ needs.release.outputs.tag }} instead of rebuilt."
          } >> "$GITHUB_STEP_SUMMARY"
