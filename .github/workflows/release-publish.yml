name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish both images even if their inputs didn't change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pokepaper-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version and Tag
    # The release commit itself is pushed with [skip ci]; never re-release it.
    if: ${{ !(startsWith(github.event.head_commit.message, 'chore(release):') && contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.push.outputs.release_sha }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the release commit can be
      # pushed to the protected main branch: the app is a ruleset bypass actor.
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOCOMMIT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version and changelog (Conventional Commits)
        id: version
        run: npm exec -- devx release version

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push release
        id: push
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git push origin HEAD:main
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${RELEASE_TAG}"
          git push origin HEAD:main
          git push origin "${RELEASE_TAG}"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  detect_changes:
    name: Detect image changes
    needs: release
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.server.outputs.should_publish }}
      edge: ${{ steps.edge.outputs.should_publish }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORCE_PUBLISH: ${{ inputs.force_publish == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Evaluate server image inputs
        id: server
        run: |
          args=(--image server --head "$TAG" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--force); fi
          node scripts/image-should-publish.mjs "${args[@]}"

      - name: Evaluate edge image inputs
        id: edge
        run: |
          args=(--image edge --head "$TAG" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--force); fi
          node scripts/image-should-publish.mjs "${args[@]}"

  publish:
    name: Publish ${{ matrix.image }} image
    needs: [release, detect_changes]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, edge]
    steps:
      - name: Check whether ${{ matrix.image }} changed
        id: gate
        env:
          SHOULD_PUBLISH: ${{ matrix.image == 'server' && needs.detect_changes.outputs.server || needs.detect_changes.outputs.edge }}
        run: |
          echo "publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "## ${{ matrix.image }} image unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "No ${{ matrix.image }} image inputs changed since the previous release; nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pokepaper-${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            type=raw,value=${{ needs.release.outputs.major }}
            type=sha,format=short

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pokepaper-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=pokepaper-${{ matrix.image }}
