name: iOS TestFlight

# Builds App PROD and uploads it to TestFlight after a release that changed
# the app (docs/ios.md -> TestFlight). Ported from go-gather's workflow,
# without its Firebase and OTA steps. PokePaper has no over-the-air updates,
# so web changes ship through TestFlight too (scripts/ios-testflight-should-deploy.mjs).

on:
  workflow_run:
    workflows:
      - "Release & Publish"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pokepaper-ios-testflight-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect app changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      matched_paths: ${{ steps.check.outputs.matched_paths }}
      release_tag: ${{ steps.check.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Evaluate app changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            { echo "should_deploy=true"; echo "matched_paths=workflow_dispatch"; echo "release_tag="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # Only deploy a release this run produced. A release run commits
          # the version bump on top of the commit that triggered it and tags
          # that, so the newest tag must contain the trigger and sit on a
          # newer commit. Otherwise nothing was released (no releasable
          # commits, or a manual rerun on the release commit itself) and the
          # last release already shipped.
          if [ -z "$CURRENT" ] \
            || ! git merge-base --is-ancestor "$HEAD_SHA" "$CURRENT" \
            || [ "$(git rev-list -n 1 "$CURRENT")" = "$HEAD_SHA" ]; then
            echo "This run released nothing new (newest tag: ${CURRENT:-none}); nothing to deploy."
            { echo "should_deploy=false"; echo "matched_paths="; echo "release_tag="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/ios-testflight-should-deploy.mjs --head "$CURRENT" --github-output "$GITHUB_OUTPUT"
          echo "release_tag=$CURRENT" >> "$GITHUB_OUTPUT"

  skip_summary:
    name: Skip summary
    needs:
      - detect_changes
    if: needs.detect_changes.outputs.should_deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write skip summary
        run: |
          {
            echo "## iOS TestFlight skipped"
            echo
            echo "This release doesn't change the iOS app (server, edge, docs, or CI only), or nothing was released."
            echo
            echo "Use **workflow_dispatch** on iOS TestFlight to force a build when needed (for example signing retries)."
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Build and Upload App PROD
    needs:
      - detect_changes
    if: needs.detect_changes.outputs.should_deploy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    # The signing and App Store Connect secrets live in this environment.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect_changes.outputs.release_tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Apple requires the iOS 26 SDK or later for uploads; the runner's
      # default Xcode is older.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
          working-directory: ios

      # The repo and its Actions logs are public. GitHub masks the secret's
      # exact value, but not the bare hostname derived from it (the passkey
      # domain the build logs), so mask that too before anything prints it.
      - name: Mask the backend host
        env:
          IOS_BACKEND_ORIGIN_PROD: ${{ secrets.IOS_BACKEND_ORIGIN_PROD }}
        run: |
          host=$(node -e 'try { console.log(new URL(process.env.IOS_BACKEND_ORIGIN_PROD).hostname) } catch {}')
          if [ -n "$host" ]; then
            echo "::add-mask::$host"
          fi

      - name: Validate iOS deploy configuration
        env:
          IOS_BACKEND_ORIGIN_PROD: ${{ secrets.IOS_BACKEND_ORIGIN_PROD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          for required in \
            IOS_BACKEND_ORIGIN_PROD \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            MATCH_PASSWORD \
            MATCH_GIT_BASIC_AUTHORIZATION
          do
            if [ -z "${!required}" ]; then
              echo "$required is required for TestFlight deploy." >&2
              exit 1
            fi
          done

      - name: Validate App Store Connect app
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane validate_asc_app

      - name: Validate match signing assets
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane validate_match

      - name: Upload to TestFlight
        id: testflight_upload
        working-directory: ios
        env:
          IOS_BACKEND_ORIGIN_PROD: ${{ secrets.IOS_BACKEND_ORIGIN_PROD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane deploy_testflight

      - name: Write upload summary
        env:
          BUILD_NUMBER: ${{ steps.testflight_upload.outputs.ios_native_build_number }}
          RELEASE_TAG: ${{ needs.detect_changes.outputs.release_tag }}
          MATCHED_PATHS: ${{ needs.detect_changes.outputs.matched_paths }}
        run: |
          {
            echo "## Uploaded to TestFlight"
            echo
            echo "- Release: ${RELEASE_TAG:-manual run}"
            echo "- Build number: ${BUILD_NUMBER:-unknown}"
            echo "- Triggered by: ${MATCHED_PATHS}"
          } >> "$GITHUB_STEP_SUMMARY"
