version: 2
updates:
  # npm workspaces: the root lockfile covers the app, server/, and shared/.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # fastlane for the iOS TestFlight workflow.
  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Both Dockerfiles pin the same Node base image as .nvmrc;
  # scripts/node-version.test.mjs fails CI until all three agree.
  - package-ecosystem: "docker"
    directories:
      - "/server"
      - "/edge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:50"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
